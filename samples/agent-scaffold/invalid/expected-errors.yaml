## 验收命令

```powershell
python tools/validate_scaffold.py --self-test
python tools/validate_scaffold.py samples/agent-scaffold/minimal
python tools/validate_scaffold.py samples/agent-scaffold/extended

Get-ChildItem -Directory samples/agent-scaffold/invalid | ForEach-Object {
  python tools/validate_scaffold.py --json $_.FullName
  "exit=$LASTEXITCODE name=$($_.Name)"
}
```

对同一个目录连续运行两次 `--json`，输出必须逐字节一致；运行前后目标目录文件内容和修改时间不得变化。无参数、非目录路径、不存在路径以及 `--self-test` 同时带工作空间时，退出码必须是 `2`。

违规样例覆盖：缺入口、缺字段、非法类型、非法枚举、同列表和跨类型重复 id、路径逃逸、孤立文件、文件名不一致、悬空引用、写入/外部调用的确认策略冲突，以及 `requires` 的字段类型、来源、引用、策略和块式解析边界。
