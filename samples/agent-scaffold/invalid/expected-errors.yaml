# 违规样例验收清单

本目录包含按类别拆分的独立工作空间。每个子目录都应由
`tools/validate_scaffold.py --json <目录>` 返回退出码 `1`，并至少包含表中列出的稳定错误码。
路径违规和非法类型可能同时产生合理的索引/磁盘一致性连带错误；这不改变主错误类别。

## 错误码

下表列出本清单涉及的稳定错误码，不是校验器错误码全集。

| 错误码 | 含义 |
| --- | --- |
| `SCAFFOLD_FILE_MISSING` | 根入口 `AGENTS.md` 不存在 |
| `SCAFFOLD_FIELD_MISSING` | 缺少必填字段 |
| `SCAFFOLD_FIELD_TYPE` | 字段类型不符合契约 |
| `SCAFFOLD_ENUM_INVALID` | 版本或枚举值不支持 |
| `SCAFFOLD_DUPLICATE_ID` | 索引、路径或状态集合出现重复标识 |
| `SCAFFOLD_PATH_ABSOLUTE` | 索引路径是绝对路径 |
| `SCAFFOLD_PATH_ESCAPE` | 索引路径含路径逃逸段或解析到工作空间外 |
| `SCAFFOLD_DISK_UNREGISTERED` | 约定目录存在未登记文件 |
| `SCAFFOLD_FILE_ID_MISMATCH` | 对象 id 与文件名主干不一致 |
| `SCAFFOLD_INDEX_PATH_MISMATCH` | 索引路径与对象 id 的约定路径不一致 |
| `SCAFFOLD_REF_DANGLING` | Skill 或 Workflow 引用无法解析 |
| `SCAFFOLD_POLICY_CONFIRMATION` | 有副作用的 Skill 缺少确认要求 |
| `SCAFFOLD_POLICY_EXTERNAL_INTEGRATION` | 外部 Skill 没有 Integration 索引 |
| `SCAFFOLD_CONTEXT_CATEGORY_DANGLING` | `requires` 引用未声明的 Context 类别 |
| `SCAFFOLD_SLUG_INVALID` | 标识或引用不是小写 slug |
| `SCAFFOLD_REQUIREMENT_SOURCE` | `requires` 携带了与来源不匹配的专属字段 |
| `SCAFFOLD_REQUIREMENT_POLICY` | `requires.note` 与缺失策略不匹配 |
| `SCAFFOLD_YAML_UNSUPPORTED` | YAML 子集不支持的语法结构 |
| `SCAFFOLD_READ_BEFORE_MISSING` | `readBefore` 引用的文件不存在或不是文件 |

